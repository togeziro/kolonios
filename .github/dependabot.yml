version: 2
updates:
  # 'bun' (not 'npm'): the npm ecosystem ignores bun.lock, producing PRs that
  # fail CI at `bun install --frozen-lockfile`. The bun ecosystem updates both
  # package.json and bun.lock. Trade-off: no Dependabot security updates for
  # this ecosystem (version updates only) — alerts are unaffected.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    reviewers:
      - 'kermit'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      tanstack:
        patterns:
          - '@tanstack/*'
      radix-ui:
        patterns:
          - '@radix-ui/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    allow:
      - dependency-type: 'direct'
    commit-message:
      prefix: 'ci'
      include: 'scope'
