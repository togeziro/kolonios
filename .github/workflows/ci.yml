name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: Lint, format & i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint (incl. i18n checks)
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-test:
    name: Build + migrations + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build (generates route tree)
        # CI uses `build:app` to skip api:docs: it only feeds the static docs
        # site (~13s on PR runners) and is regenerated nightly. Local dev runs
        # `bun run build` which keeps the convenience of bundled docs.
        run: bun run build:app

      - name: Typecheck
        run: bun run typecheck

  test-unit:
    name: Unit tests (no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Unit tests (vitest --project unit)
        # 183 files pure unit/component, 4 workers parallel; no DB or
        # migrations needed. Coverage runs in coverage-nightly.yml once a
        # day so the thresholds in vite.config.ts gate merges.
        run: bun run test:unit

  test-integration:
    name: Integration tests + drift check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tanstack
          POSTGRES_PASSWORD: tanstack
          POSTGRES_DB: kolonios
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://tanstack:tanstack@localhost:5432/kolonios_test
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check schema/migrations drift
        run: bun run db:check

      - name: Set up test database
        run: bun run db:test:create

      - name: Integration tests (vitest --project integration)
        # Single worker on the shared test schema (each file resets/reseeds
        # in beforeEach). 24 files, ~56s locally.
        run: bun run test:integration
