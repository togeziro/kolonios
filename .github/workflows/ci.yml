name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: Lint, format & i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: ./.github/actions/setup

      - name: Lint (incl. i18n checks)
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-test:
    name: Build, migrations & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tanstack
          POSTGRES_PASSWORD: tanstack
          POSTGRES_DB: kolonios
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://tanstack:tanstack@localhost:5432/kolonios_test
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: ./.github/actions/setup

      - name: Build (generates route tree)
        run: bun run build

      - name: Set up test database
        run: bun run db:test:create

      - name: Check schema/migrations drift
        run: bun run db:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit & integration tests (with coverage)
        run: bun run test:coverage
